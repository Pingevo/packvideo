# server block สำหรับ packvideo.digital.in.th
# เพิ่มเข้า nginx ตัวที่มีอยู่แล้ว — SSL จัดการที่ nginx เหมือน sellcenter
#
# HTTPS จำเป็น ไม่ใช่ทางเลือก: getUserMedia ไม่ทำงานบน http และ sendBeacon จากหน้า
# https://digital.in.th ไปยัง http จะถูกบล็อกเป็น mixed content

upstream packvideo_app {
    server 127.0.0.1:1338;
    keepalive 32;
}

server {
    listen 80;
    server_name packvideo.digital.in.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name packvideo.digital.in.th;

    ssl_certificate     /etc/letsencrypt/live/packvideo.digital.in.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packvideo.digital.in.th/privkey.pem;

    # คลิปเป็นหลักฐาน ห้ามให้ที่ไหนเอาไปฝังหรือ index
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/packvideo.access.log;
    error_log  /var/log/nginx/packvideo.error.log;

    client_max_body_size 8m;   # ชิ้นวิดีโอ ~0.25–0.5 MB มีที่เหลือเฟือ
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── SSE ────────────────────────────────────────────────────
    # ถ้าไม่ปิด buffering หน้าต่างอัดจะไม่ได้รับสัญญาณจนกว่า buffer จะเต็ม
    # และ read_timeout ปริยาย 60 วิ จะตัดการเชื่อมต่อทิ้งกลางกะ
    location /api/stream/ {
        proxy_pass http://packvideo_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ── สตรีมคลิป ──────────────────────────────────────────────
    # ต้องส่ง Range ผ่านไปตรงๆ ให้ได้ 206 ไม่งั้นเลื่อนดูกลางคลิปไม่ได้ (FR-4.5)
    location /media/ {
        proxy_pass http://packvideo_app;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── สคริปต์ที่หน้าเดิมโหลด ──────────────────────────────────
    # ต้องเบา เพราะโหลดทุกครั้งที่พนักงานสแกน — แม้จะเป็น async ก็ไม่ควรให้ช้า
    location = /hook.js {
        proxy_pass http://packvideo_app;
        proxy_cache_valid 200 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # ── ลิงก์สำหรับบุคคลภายนอก ─────────────────────────────────
    # จำกัดอัตราเพื่อกันไล่เดา token (NFR-3.6)
    location /s/ {
        limit_req zone=packvideo_share burst=10 nodelay;
        proxy_pass http://packvideo_app;
    }

    location / {
        proxy_pass http://packvideo_app;
        proxy_read_timeout 60s;
    }
}

# วางไว้ในบล็อก http {} ของ nginx.conf
# limit_req_zone $binary_remote_addr zone=packvideo_share:10m rate=30r/m;
