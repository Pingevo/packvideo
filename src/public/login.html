<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — packvideo</title>
<style>
  :root { color-scheme: light dark; --line: rgba(128,128,128,.3); --accent: #2563eb; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; margin: 0;
         min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
  .card { max-width: 420px; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 8px 0; line-height: 1.55; opacity: .85; }
  a.btn, button { display: block; width: 100%; box-sizing: border-box; text-align: center; font: inherit;
         font-weight: 700; padding: 12px; border-radius: 8px; margin-top: 12px; cursor: pointer; text-decoration: none; }
  a.btn { background: var(--accent); color: #fff; border: 0; }
  button { background: transparent; color: inherit; border: 1px solid var(--line); }
  #msg { min-height: 1.5em; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>เข้าสู่ระบบด้วยบัญชี sellcenter</h1>
  <p>ระบบวิดีโอแพ็คใช้บัญชีเดียวกับ sellcenter — ถ้าล็อกอิน sellcenter อยู่แล้ว กด "เข้าใช้งาน" ได้เลย</p>
  <a class="btn" id="login" target="_blank" rel="noopener">เปิด sellcenter เพื่อล็อกอิน</a>
  <button id="retry">ล็อกอินแล้ว — เข้าใช้งาน</button>
  <p id="msg"></p>
</div>
<script>
(function () {
  'use strict';
  var next = new URLSearchParams(location.search).get('next') || '/clips.html';
  // กันลิงก์หลอกให้เด้งไปเว็บอื่นหลังล็อกอิน — รับเฉพาะเส้นทางในเว็บนี้
  if (!/^\/(?!\/)/.test(next)) next = '/clips.html';

  function check(auto) {
    fetch('/api/me', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('login').href = d.login_url || 'https://digital.in.th/';
      if (d.user || !d.auth_enforced) { location.replace(next); return; }
      if (!auto) document.getElementById('msg').textContent = 'ยังไม่พบการล็อกอิน — ล็อกอิน sellcenter ในแท็บที่เปิดขึ้นมาก่อน แล้วกดอีกครั้ง';
    }).catch(function () {
      document.getElementById('msg').textContent = 'ติดต่อระบบไม่ได้ ลองใหม่อีกครั้ง';
    });
  }
  document.getElementById('retry').onclick = function () { check(false); };
  // กลับมาที่แท็บนี้หลังล็อกอินในแท็บอื่น → เข้าให้เองไม่ต้องกด
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(true); });
  check(true);
})();
</script>
</body>
</html>
