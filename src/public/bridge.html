<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>packvideo bridge</title>
</head>
<body>
<!--
  bridge.html — ให้หน้าแพ็คของ sellcenter (คนละ origin) อ่านค่า station_id/token
  ที่ setup.html เก็บไว้ใน localStorage ของ origin นี้ได้ โดยไม่ต้องให้พนักงาน
  เปิด console ก๊อปค่าข้าม origin ด้วยมือ

  ใช้ยังไง (ฝั่ง sellcenter):
    <iframe hidden src="https://pack.digital.in.th/bridge.html"></iframe>
    window.addEventListener('message', function (ev) {
      if (ev.origin !== 'https://pack.digital.in.th') return;
      if (!ev.data || ev.data.source !== 'packvideo-bridge') return;
      // ev.data.station_id, ev.data.token
    });

  ต้อง postMessage ไปที่ origin ที่ระบุตรงๆ เท่านั้น (ไม่ใช้ '*') กัน localStorage
  รั่วไปหาหน้าอื่นที่ดันมาฝัง iframe นี้โดยไม่ได้รับอนุญาต — รายชื่อ origin ที่ยอมรับ
  ใช้ตัวเดียวกับ ALLOWED_ORIGINS ที่ /signal ใช้เช็คอยู่แล้ว (src/config.js)
-->
<script>
(function () {
  'use strict';

  var K = { station: 'packvideo.station_id', token: 'packvideo.token' };

  // รายชื่อ origin ของ sellcenter ที่อนุญาตให้รับค่านี้ — ตรงกับ ALLOWED_ORIGINS ใน .env
  // เพิ่ม/ลด subdomain ที่นี่ให้ตรงกับรายชื่อนั้นเสมอ ไม่งั้น origin ใหม่จะเงียบไปเฉยๆ
  var ALLOWED_TARGETS = [
    'https://digital.in.th',
    'https://delivery.digital.in.th',
    'https://dev.digital.in.th',
    'https://stock.digital.in.th',
    'https://technic.digital.in.th',
    'https://support.digital.in.th',
    'https://finance.digital.in.th',
    'https://mkt.digital.in.th',
    'https://sales.digital.in.th',
    'https://data.digital.in.th',
    'https://cs.digital.in.th',
    'https://merchant.digital.in.th',
    'https://purchase.digital.in.th',
    'https://time.digital.in.th',
    'https://customer.digital.in.th',
    'https://api.digital.in.th',
  ];

  function send() {
    var target = null;
    try {
      // referrer คือ URL เต็มของหน้าที่ฝัง iframe นี้ — ใช้หา origin ของผู้ฝัง
      // ต้องเทียบกับ allowlist ก่อนเสมอ ห้ามเชื่อ document.referrer เฉยๆ แล้วยิงกลับไป
      // เพราะนั่นเท่ากับส่ง token ให้ origin ไหนก็ได้ที่ดันมาฝัง iframe นี้
      var ref = document.referrer ? new URL(document.referrer).origin : null;
      if (ref && ALLOWED_TARGETS.indexOf(ref) !== -1) target = ref;
    } catch (e) { /* referrer อ่านไม่ได้ — ไม่ส่งอะไรทั้งนั้น ปลอดภัยไว้ก่อน */ }

    if (!target) return;   // ผู้ฝังไม่อยู่ใน allowlist — เงียบไปเฉยๆ ไม่ throw ไม่ log อะไรที่นี่

    var stationId = null, token = null;
    try {
      stationId = localStorage.getItem(K.station);
      token = localStorage.getItem(K.token);
    } catch (e) { /* localStorage ปิด — ส่งค่าว่างไป ฝั่ง sellcenter จะ fallback เอง */ }

    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { source: 'packvideo-bridge', station_id: stationId, token: token },
        target,
      );
    }
  }

  send();
})();
</script>
</body>
</html>
