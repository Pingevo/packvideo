<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวอัดวิดีโอ — packvideo</title>
<style>
  :root { color-scheme: dark; --line: rgba(255,255,255,.16); }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
         margin: 0; padding: 14px; background: #0d1117; color: #e6edf3;
         line-height: 1.45; user-select: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .station { font-size: 17px; font-weight: 700; }
  .rec { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .rec .dot { width: 10px; height: 10px; border-radius: 50%; background: #6e7681; }
  .rec.on .dot { background: #f85149; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  video { width: 100%; border-radius: 9px; background: #000; display: block; aspect-ratio: 16/9;
          object-fit: cover; }
  .info { margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
  .row .k { opacity: .55; }
  .row .v { font-family: ui-monospace, Menlo, monospace; text-align: right; word-break: break-all; }
  .bar { display: flex; gap: 8px; margin-top: 10px; font-size: 12px; opacity: .75;
         justify-content: space-between; }
  button { font: inherit; padding: 11px 14px; border-radius: 8px; cursor: pointer; font-weight: 700;
           border: 1px solid var(--line); background: transparent; color: inherit; width: 100%;
           margin-top: 10px; }
  button:active { transform: scale(.99); }
  #stop { border-color: #f0883e; color: #f0883e; }
  #stop.arming { background: #f0883e; color: #0d1117; }
  .banner { position: fixed; inset: 0; display: none; flex-direction: column; gap: 14px;
            align-items: center; justify-content: center; text-align: center; padding: 28px;
            background: #7d1a1a; z-index: 50; }
  .banner.show { display: flex; }
  .banner h2 { font-size: 26px; margin: 0; }
  /* pre-line เพื่อให้ \n ในข้อความขึ้นบรรทัดใหม่จริง — สามค่านี้ต้องอ่านแยกกันได้ในวินาทีเดียว */
  .banner p { margin: 0; font-size: 17px; font-family: ui-monospace, Menlo, monospace;
              white-space: pre-line; line-height: 1.8; }
  .banner button { max-width: 260px; background: #fff; color: #7d1a1a; border-color: #fff; }
  .warn { background: #9a6700; color: #fff; padding: 9px 12px; border-radius: 8px;
          font-size: 13px; margin-bottom: 10px; display: none; }
  .warn.show { display: block; }
  a { color: #58a6ff; }
  .msg { display: none; padding: 10px 12px; border-radius: 8px; }
  .msg.ok  { display: block; background: rgba(46,160,67,.15); border: 1px solid rgba(46,160,67,.5); }
  .msg.bad { display: block; background: rgba(248,81,73,.15); border: 1px solid rgba(248,81,73,.5); }
</style>
</head>
<body>

<div class="banner" id="banner">
  <h2>⚠️ ใบปะหน้าไม่ตรงกับออเดอร์ที่กำลังแพ็ค</h2>
  <p id="banner-detail"></p>
  <button id="banner-ok">รับทราบ</button>
</div>

<header>
  <div class="station" id="station">—</div>
  <span data-packvideo-panel style="margin-left:auto;margin-right:14px"></span>
  <div class="rec" id="rec"><span class="dot"></span><span id="rec-text">พร้อม</span></div>
</header>

<div class="warn" id="warn"></div>

<video id="preview" autoplay muted playsinline></video>

<div class="info">
  <div class="row"><span class="k">ออเดอร์</span><span class="v" id="ordersn">—</span></div>
  <div class="row"><span class="k">เลขพัสดุ</span><span class="v" id="tracking">—</span></div>
  <div class="row"><span class="k">เวลาอัด</span><span class="v" id="elapsed">—</span></div>
</div>

<button id="stop" disabled>ปิดคลิปเอง (กดค้าง 1 วินาที)</button>
<button id="camtest">ทดสอบกล้อง 3 วินาที</button>
<div class="msg" id="camtest-result" style="margin-top:8px;font-size:13px"></div>

<div class="bar">
  <span id="queue">คิว 0</span>
  <span id="disk">ดิสก์ —</span>
  <span id="conn">ยังไม่เชื่อมต่อ</span>
</div>

<script src="/session.js"></script>
<script src="/camtest.js"></script>
<script src="/chunk-queue.js"></script>
<script src="/panel.js"></script>
<script>
(function () {
  'use strict';

  // เปลี่ยนทุกครั้งที่แก้ตรรกะการอัด — เซิร์ฟเวอร์อ่านค่านี้จากไฟล์แล้วเทียบกับที่ heartbeat
  // ส่งมา หน้าต่างอัดที่เปิดค้างมาตั้งแต่ก่อน deploy จะถูกบอกให้รีเฟรช (หน้านี้เปิดทั้งกะ
  // ไม่รีเฟรชเอง โค้ดใหม่จึงไม่มีผลจนกว่าจะมีคนกด)
  var VERSION = '0.2.2';
  var K = {
    station: 'packvideo.station_id', camera: 'packvideo.camera_id', client: 'packvideo.client_id',
    device: 'packvideo.device_name',
  };

  var station = localStorage.getItem(K.station);
  if (!station) {
    document.body.innerHTML =
      '<div style="padding:40px;text-align:center"><h2>เครื่องนี้ยังไม่ได้ตั้งค่า</h2>' +
      '<p>ไปที่ <a href="/setup.html">หน้าตั้งค่า</a> เพื่อเลือกโต๊ะก่อน</p></div>';
    return;
  }

  var S = {
    clipId: null, ordersn: null, tracking: null,
    stream: null, startedAt: 0,
    queueDepth: 0, allowed: true, cameraReady: false,
    timeslice: 1000, videoBps: 1000000, pingMs: 20000,
  };

  function $(id) { return document.getElementById(id); }
  function setText(id, v) { $(id).textContent = v; }

  function isCameraLive() {
    if (!S.stream || !S.cameraReady) return false;
    var tracks = S.stream.getVideoTracks();
    if (!tracks.length) return false;
    return tracks[0].readyState === 'live' && !tracks[0].muted;
  }

  // ── กล้อง ───────────────────────────────────────────────────
  /**
   * โหมดสาธิต: ใช้ภาพจาก canvas แทนกล้อง สำหรับดูการทำงานบนเครื่องที่ไม่มีกล้อง
   *
   * **ต้องใช้ไม่ได้บน production เด็ดขาด** — ถ้าเปิดได้จะบันทึกภาพที่ไม่ใช่ของจริง
   * ลงเป็นหลักฐาน จึงถาม /api/health ก่อนว่าเซิร์ฟเวอร์เป็น production หรือไม่
   * ไม่ใช่เชื่อค่าจาก URL อย่างเดียว
   */
  function fakeCameraAllowed() {
    if (location.search.indexOf('fakecam') === -1) return Promise.resolve(false);
    return fetch('/api/health')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.env === 'production') {
          warn('โหมดกล้องจำลองใช้บนระบบจริงไม่ได้');
          return false;
        }
        return true;
      })
      .catch(function () { return false; });
  }

  function fakeCameraStream() {
    var cv = document.createElement('canvas');
    cv.width = 1280; cv.height = 720;
    var ctx = cv.getContext('2d');
    var t0 = Date.now();
    var stream = cv.captureStream(0);
    var track = stream.getVideoTracks()[0];
    setInterval(function () {
      var t = (Date.now() - t0) / 1000;
      ctx.fillStyle = '#1b2430'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#e6edf3'; ctx.font = 'bold 44px monospace';
      ctx.fillText('โหมดสาธิต — ไม่ใช่ภาพจากกล้องจริง', 60, 110);
      ctx.font = '30px monospace';
      ctx.fillText(new Date().toLocaleString('th-TH'), 60, 170);
      ctx.fillText('t = ' + t.toFixed(1) + ' s', 60, 220);
      // กล่องเคลื่อนที่ ให้ตัวเข้ารหัสมีอะไรให้บีบจริงๆ ไม่ใช่ภาพนิ่ง
      ctx.fillStyle = '#4a9eff';
      ctx.fillRect(60 + ((t * 160) % (cv.width - 320)), 300, 240, 240);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 52px monospace';
      ctx.fillText(S.tracking || 'รอเลขพัสดุ', 60, 640);
      if (track.requestFrame) track.requestFrame();
    }, 40);
    return stream;
  }

  function startCamera() {
    return fakeCameraAllowed().then(function (fake) {
      if (!fake) return realCamera();
      var s = fakeCameraStream();
      S.stream = s;
      S.cameraReady = true;
      $('preview').srcObject = s;
      warn('โหมดสาธิต — ภาพที่บันทึกไม่ใช่ภาพจากกล้องจริง');
      sendHeartbeat();
      return s;
    });
  }

  function realCamera() {
    var camId = localStorage.getItem(K.camera);
    var constraints = {
      audio: false,   // ไม่บันทึกเสียงเด็ดขาด ไม่มีสวิตช์ให้เปิด (FR-1.11 · PDPA)
      video: camId ? { deviceId: { exact: camId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                   : { width: { ideal: 1920 }, height: { ideal: 1080 } },
    };
    return navigator.mediaDevices.getUserMedia(constraints).then(function (s) {
      // ลองเปิดซ้ำหลังกล้องค้าง/ถูกถอดได้สตรีมใหม่ — ปล่อยตัวเก่าก่อน ไม่งั้นไฟกล้องค้างและเปิดซ้อนกัน
      if (S.stream && S.stream !== s) {
        S.stream.getTracks().forEach(function (t) {
          t.onended = null; t.onmute = null; t.onunmute = null;
          try { t.stop(); } catch (e) {}
        });
      }
      S.stream = s;
      S.cameraReady = true;
      $('preview').srcObject = s;
      clearWarn();
      // กล้องถูกถอดกลางกะต้องขึ้นแดงทันที ไม่ใช่เงียบไปเฉยๆ
      s.getVideoTracks().forEach(function (t) {
        t.onended = function () {
          S.stream = null;
          S.cameraReady = false;
          warn('กล้องหลุด — เสียบใหม่แล้วรีเฟรชหน้านี้');
          sendHeartbeat();
        };
        t.onmute = function () {
          S.cameraReady = false;
          warn('สัญญาณกล้องหยุดชั่วคราว (Muted)');
          sendHeartbeat();
        };
        t.onunmute = function () {
          S.cameraReady = true;
          clearWarn();
          sendHeartbeat();
        };
      });
      sendHeartbeat();
      return s;
    }).catch(function (err) {
      S.stream = null;
      S.cameraReady = false;
      sendHeartbeat();
      throw err;
    });
  }

  function pickMime() {
    var list = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    for (var i = 0; i < list.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(list[i])) return list[i];
    }
    return '';
  }

  // ── อัด ─────────────────────────────────────────────────────
  /**
   * ตัวอัดหนึ่งตัวผูกกับคลิปเดียวตลอดชีวิตของมัน
   *
   * รุ่นก่อน 0.2.0 ใช้ S.clipId / S.seq ตัวกลาง แล้ว ondataavailable อ่านค่า ณ ตอนที่
   * event เกิด — แต่ชิ้นสุดท้ายหลัง stop() ถูกปล่อยแบบ async ทีหลังเสมอ:
   *  - ถ้าคลิปใหม่เริ่มก่อน ชิ้นท้ายของคลิปเก่าถูกติดป้ายเป็น "ชิ้นแรกของคลิปใหม่"
   *    ไฟล์ใหม่ขึ้นต้นด้วย moof ของคลิปอื่นแล้วเปิดไม่ได้ (324 คลิปถึง 17 ก.ย. 2026)
   *  - ถ้าไม่มีคลิปใหม่ ชิ้นท้ายไปถึงหลังสั่ง finalise แล้วโดน 409 ทิ้ง
   *    ไฟล์ยาวลงตัวที่จำนวนเท่าของชิ้นพอดี ท้ายคลิปหาย 0–3.4 วินาทีทุกคลิป
   *  - handler ของ stop หน่วง 600 ms แล้วสั่ง S.recorder.stop() ซึ่งตอนนั้นอาจเป็นตัวอัด
   *    ของคลิปใหม่ไปแล้ว คลิปใหม่จึงหยุดอัดกลางทาง
   *
   * ตอนนี้ทุกอย่างของคลิปอยู่ใน rec ของมันเอง และปิดคลิปหลัง onstop (ซึ่งยิงหลังชิ้นสุดท้ายเสมอ)
   * บวกรอให้ชิ้นลงคิวและส่งขึ้นครบก่อน
   */
  var active = null;      // ตัวอัดของคลิปที่กำลังอัดอยู่
  var retiring = 0;       // จำนวนคลิปที่กำลังรอส่งชิ้นสุดท้าย — ห้ามรีโหลดหน้าระหว่างนี้

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function beginClip(clipId) {
    if (active) retire(active);
    if (!S.allowed) { warn('ดิสก์เต็ม — ไม่ได้บันทึกคลิปนี้'); return; }
    if (!isCameraLive()) {
      warn('กล้องไม่พร้อมหรือกล้องหลุด — ไม่ได้บันทึกคลิปนี้');
      sendHeartbeat();
      return;
    }

    var recorder;
    try {
      recorder = new MediaRecorder(S.stream, { mimeType: pickMime(), videoBitsPerSecond: S.videoBps });
    } catch (e) {
      warn('เริ่มอัดไม่ได้: ' + e.message);
      S.cameraReady = false;
      sendHeartbeat();
      return;
    }

    var rec = { clipId: clipId, recorder: recorder, seq: 0, pushes: Promise.resolve(), stopping: null, finalising: null };
    rec.stopped = new Promise(function (resolve) { recorder.onstop = resolve; });

    recorder.onerror = function (e) {
      warn('MediaRecorder ขัดข้อง: ' + (e.error ? e.error.message : 'error'));
      S.cameraReady = false;
      sendHeartbeat();
    };

    recorder.ondataavailable = function (e) {
      if (!e.data || !e.data.size) return;
      var seq = rec.seq++;
      // ต่อคิวทีละชิ้นตามลำดับ — IndexedDB ไม่รับประกันว่า put ที่เรียกก่อนจะเสร็จก่อน
      rec.pushes = rec.pushes.then(function () {
        return queue.push(rec.clipId, seq, e.data);
      }).catch(function (err) {
        warn('เก็บชิ้นวิดีโอลงเครื่องไม่ได้: ' + err.message);
      });
    };

    recorder.start(S.timeslice);
    active = rec;
    S.clipId = clipId; S.startedAt = Date.now();
    setRec(true);
  }

  /** หยุดตัวอัด แล้วรอจนชิ้นสุดท้ายลงคิวในเครื่อง — ไม่รอส่งขึ้นเซิร์ฟเวอร์ */
  function drain(rec) {
    if (rec.stopping) return rec.stopping;
    try { if (rec.recorder.state !== 'inactive') rec.recorder.stop(); } catch (e) {}
    // onstop ยิงหลัง dataavailable ตัวสุดท้ายตามสเปก — เพดาน 3 วินาทีกันเบราว์เซอร์ที่ไม่ยิง
    rec.stopping = Promise.race([rec.stopped, wait(3000)])
      .then(function () { return rec.pushes; });
    return rec.stopping;
  }

  /** สั่งปิดคลิป — ลองซ้ำเมื่อเน็ตสะดุด เพราะถ้าไม่ถึง เซิร์ฟเวอร์จะปิดเองที่ 8 วินาทีโดยไม่รอชิ้นที่ค้าง */
  function postFinalise(rec, body, attempt) {
    return fetch('/api/clip/' + encodeURIComponent(rec.clipId) + '/finalise', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    }).catch(function (err) {
      if (attempt >= 3) throw err;
      return wait(1000 * (attempt + 1)).then(function () { return postFinalise(rec, body, attempt + 1); });
    });
  }

  /**
   * ปิดคลิปให้จบ — ครั้งเดียวต่อคลิป เรียกซ้ำได้
   *
   * status ว่าง = ให้เซิร์ฟเวอร์ใช้สถานะที่ตัดสินไว้แล้วตอนสั่งหยุด (เช่น verified จากการ
   * สแกนใบปะหน้า) — ถ้าส่ง unverified ทับตอนคลิปใหม่มาแทรก จะทำให้คลิปที่ยิงตรงแล้วกลายเป็นไม่ตรง
   *
   * บอกจำนวนชิ้นทั้งหมดทันทีที่หยุดอัด แล้วปล่อยให้คิวส่งชิ้นที่ค้างตามไปเอง (0.2.2)
   * รุ่นก่อนรอคิวส่งครบไม่เกิน 30 วินาทีแล้วค่อยสั่งปิด — 2026-10-01 เน็ตขาขึ้นช้าชิ้นละ 15–40 วินาที
   * เซิร์ฟเวอร์ปิดไฟล์ไปก่อน ชิ้นที่ตามมาโดน 409 แล้วคิวลบทิ้งทั้งคลิป 14 คลิปเหลือแค่ส่วนหัว
   * เซิร์ฟเวอร์ที่รู้จำนวนชิ้นจะรอจนครบ (หรือเงียบเกิน 2 นาทีค่อยปิดแบบขาดช่วง)
   */
  function retire(rec, status) {
    if (active === rec) clearActive();
    if (rec.finalising) return rec.finalising;
    retiring++;
    rec.finalising = drain(rec).then(function () {
      var body = { chunks: rec.seq };
      if (status) body.status = status;
      queue.pump();
      return postFinalise(rec, body, 0);
    }).catch(function (err) {
      try { console.warn('[packvideo] finalise error:', err); } catch (e) {}
    }).then(function () { retiring--; });
    return rec.finalising;
  }

  /** คลิปถูกทิ้ง — หยุดอัดแล้วลบชิ้นที่ค้างในเครื่อง ไม่ต้องเสียแบนด์วิดท์ส่ง */
  function discard(rec) {
    if (active === rec) clearActive();
    try { if (rec.recorder.state !== 'inactive') rec.recorder.stop(); } catch (e) {}
    Promise.race([rec.stopped, wait(3000)])
      .then(function () { return rec.pushes; })
      .then(function () { return queue.dropClip(rec.clipId); })
      .catch(function () {});
  }

  function clearActive() {
    active = null;
    S.clipId = null; S.ordersn = null; S.tracking = null;
    setRec(false);
    setText('ordersn', '—'); setText('tracking', '—'); setText('elapsed', '—');
    $('stop').disabled = true;
  }

  function setRec(on) {
    $('rec').className = 'rec' + (on ? ' on' : '');
    setText('rec-text', on ? 'กำลังอัด' : 'พร้อม');
    $('stop').disabled = !on;
    // ยิงทันทีไม่รอรอบ 30 วินาที — แถบสถานะบนหน้าแพ็คอ่านค่านี้ ถ้ารอรอบปกติ
    // พนักงานจะเห็น "พร้อม" ค้างอยู่ทั้งที่กล้องเริ่มบันทึกไปแล้วครึ่งนาที
    sendHeartbeat();
  }

  // ── คิวชิ้นวิดีโอ ───────────────────────────────────────────
  // เก็บลง IndexedDB ทันที แล้วค่อยทยอยส่ง — เน็ตขาดหรือหน้าถูกปิดก็ไม่หาย (NFR-1.4)
  var queue = new ChunkQueue({
    onchange: function (n) {
      S.queueDepth = n;
      setText('queue', 'คิว ' + n);
      if (n > 20) warn('คิวอัปโหลดค้าง ' + n + ' ชิ้น');
      else if (n === 0) clearWarn();
    },
    onlog: function (m) { try { console.info('[คิว]', m); } catch (e) {} },
  });

  // ── ปิดคลิปเอง ──────────────────────────────────────────────
  // ต้องกดค้าง 1 วินาที กันกดโดนตอนหยิบของ (FR-1.10)
  (function () {
    var timer = null;
    var btn = $('stop');
    function down() {
      if (btn.disabled) return;
      btn.classList.add('arming');
      timer = setTimeout(function () {
        btn.classList.remove('arming');
        if (active) retire(active, 'manual_stop');
      }, 1000);
    }
    function up() { clearTimeout(timer); btn.classList.remove('arming'); }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointerleave', up);
  })();

  // ── รับสัญญาณจากเซิร์ฟเวอร์ ─────────────────────────────────
  var es = null;
  var esTimer = null;
  var lastEventAt = 0;
  var reconnectDelay = 1000;

  /**
   * เปิดสาย SSE ใหม่ทั้งเส้น
   *
   * เบราว์เซอร์ต่อ EventSource ใหม่ให้เองเฉพาะตอนสายขาดแบบธรรมดา — ถ้าโดนตอบกลับเป็น 502
   * (nginx เจอ upstream ไม่ตอบ) มันเลิกลองถาวร (readyState=CLOSED) และถ้าสายตายแบบ half-open
   * (NAT ทิ้งเงียบๆ) มันไม่รู้เลย ทั้งสองแบบหน้านี้จะเปิดค้างและส่ง heartbeat ต่อไปเรื่อยๆ
   * โดยไม่รับสัญญาณ start อีกเลย → คลิปว่างทั้งวัน จึงต้องเฝ้าเองและต่อใหม่เอง
   */
  function scheduleReconnect() {
    if (esTimer) return;
    try { if (es) es.close(); } catch (e) {}
    es = null;
    setText('conn', 'ขาดการเชื่อมต่อ — กำลังต่อใหม่');
    esTimer = setTimeout(function () { esTimer = null; connect(); }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  }

  // เซิร์ฟเวอร์ส่งเหตุการณ์ ping ทุก pingMs — เงียบเกิน 2.5 เท่า = สายตายแต่ไม่มีใครบอก
  setInterval(function () {
    if (!es) return;
    if (Date.now() - lastEventAt > Math.max(S.pingMs * 2.5, 3000)) {
      warn('สัญญาณจากเซิร์ฟเวอร์เงียบ — กำลังต่อใหม่');
      scheduleReconnect();
    }
  }, 1000);

  function connect() {
    if (esTimer) { clearTimeout(esTimer); esTimer = null; }
    try { if (es) es.close(); } catch (e) {}
    es = new EventSource('/api/stream/' + encodeURIComponent(station));
    lastEventAt = Date.now();

    es.onopen = function () {
      setText('conn', 'เชื่อมต่อแล้ว');
      reconnectDelay = 1000;
      lastEventAt = Date.now();
    };
    es.onerror = function () {
      setText('conn', 'ขาดการเชื่อมต่อ — กำลังต่อใหม่');
      if (es && es.readyState === 2 /* CLOSED */) scheduleReconnect();
    };
    ['config', 'start', 'commit', 'abort', 'tag', 'stop', 'mismatch', 'ship', 'ping'].forEach(function (name) {
      es.addEventListener(name, function () { lastEventAt = Date.now(); });
    });

    es.addEventListener('config', function (e) {
      var d = JSON.parse(e.data);
      if (d.ping_ms) S.pingMs = d.ping_ms;
      S.allowed = d.recording !== false;
      if (d.timeslice_ms) S.timeslice = d.timeslice_ms;
      if (d.video_bps) S.videoBps = d.video_bps;
      // เซิร์ฟเวอร์มีหน้าต่างอัดรุ่นใหม่กว่า — รีโหลดตัวเองตอนว่าง (ไม่มีคลิปและคิวว่าง)
      if (d.rec_version && d.rec_version !== VERSION) reloadWhenIdle();
      setText('disk', 'ดิสก์ ' + (d.disk_used_pct != null ? d.disk_used_pct + '%' : '—'));
      if (!S.allowed) warn('ดิสก์เต็ม — หยุดบันทึกชั่วคราว งานแพ็คทำต่อได้ตามปกติ');
      else clearWarn();
    });

    es.addEventListener('start', function (e) { beginClip(JSON.parse(e.data).clip_id); });

    es.addEventListener('commit', function (e) {
      var d = JSON.parse(e.data);
      S.ordersn = d.ordersn; setText('ordersn', d.ordersn || '—');
    });

    es.addEventListener('abort', function (e) {
      var d = {};
      try { d = JSON.parse(e.data); } catch (err) {}
      if (active && (!d.clip_id || active.clipId === d.clip_id)) discard(active);
    });

    es.addEventListener('tag', function (e) {
      var d = JSON.parse(e.data);
      S.tracking = d.tracking_no; setText('tracking', d.tracking_no || '—');
    });

    es.addEventListener('stop', function (e) {
      var d = {};
      try { d = JSON.parse(e.data); } catch (err) {}
      // ยึด clip_id จากสัญญาณ ไม่ใช่คลิปปัจจุบัน — สัญญาณหยุดของคลิปเก่าอาจมาถึงตอนคลิปใหม่เริ่มแล้ว
      var rec = active && (!d.clip_id || active.clipId === d.clip_id) ? active : null;
      if (!rec) return;       // คลิปนี้ถูกปิดไปแล้วตอนคลิปใหม่มาแทรก
      clearActive();
      // อัดต่ออีก 600 ms ให้เห็นกล่องหลังยิงบาร์โค้ดชัดๆ แล้วค่อยปิด
      // ถ้าคลิปใหม่เริ่มระหว่างรอ beginClip ไม่เห็น rec นี้แล้ว (active ถูกล้าง) จึงไม่ไปหยุดตัวใหม่
      setTimeout(function () { retire(rec, d.status); }, 600);
    });

    es.addEventListener('mismatch', function (e) {
      var d = JSON.parse(e.data);
      $('banner-detail').textContent =
        'ออเดอร์ ' + (d.ordersn || '—') + '\nควรเป็น ' + (d.expected || '—') + '\nสแกนได้ ' + (d.scanned || '—');
      $('banner').classList.add('show');
      beep();
    });
  }

  // หน้าต่างอัดห้ามเด้งไปหน้าล็อกอินกลางคลิป — session หมดขณะอัดแค่ขึ้นแถบเตือน
  // (ชิ้นวิดีโอที่ส่งไม่ผ่านรออยู่ในคิวเครื่อง ล็อกอินใหม่แล้วส่งต่อเอง)
  if (window.PackvideoSession) {
    PackvideoSession.setBusy(function () { return !!active || retiring > 0 || S.queueDepth > 0; });
    PackvideoSession.me();
  }

  // ── ทดสอบกล้อง (R5.3) ───────────────────────────────────────
  // ทำได้เฉพาะตอนว่าง — อัดทดสอบซ้อนกับคลิปจริงจะแย่ง CPU และทำให้คลิปจริงกระตุก
  $('camtest').onclick = function () {
    var b = this;
    if (active) { warn('กำลังอัดคลิปจริงอยู่ — ทดสอบหลังแพ็คกล่องนี้เสร็จ'); return; }
    b.disabled = true; b.textContent = 'กำลังอัดทดสอบ 3 วินาที…';
    PackvideoCamTest.run(isCameraLive() ? S.stream : null, { seconds: 3, station: station })
      .then(function (r) { PackvideoCamTest.render($('camtest-result'), r); })
      .catch(function (e) { PackvideoCamTest.render($('camtest-result'), { ok: false, problems: [e.message] }); })
      .then(function () { b.disabled = false; b.textContent = 'ทดสอบกล้องอีกครั้ง'; });
  };

  var reloadTimer = null;
  function reloadWhenIdle() {
    if (reloadTimer) return;
    warn('มีหน้าต่างอัดรุ่นใหม่ — จะรีเฟรชเองตอนว่าง');
    reloadTimer = setInterval(function () {
      if (active || retiring > 0 || S.queueDepth > 0) return;
      location.reload();
    }, 2000);
  }

  // เตือนด้วยเสียงด้วย เพราะพนักงานกำลังก้มมองกล่อง ไม่ได้มองจอ
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.3, 0.6].forEach(function (t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.15;
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.18);
      });
    } catch (e) {}
  }

  function warn(msg) { $('warn').textContent = msg; $('warn').classList.add('show'); }
  function clearWarn() { $('warn').classList.remove('show'); }

  $('banner-ok').onclick = function () { $('banner').classList.remove('show'); };

  // ── นาฬิกาและ heartbeat ─────────────────────────────────────
  setInterval(function () {
    if (!S.clipId || !S.startedAt) return;
    var s = Math.floor((Date.now() - S.startedAt) / 1000);
    setText('elapsed', Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'));
  }, 500);

  // การจับจองโต๊ะอยู่ในหน่วยความจำเซิร์ฟเวอร์ล้วนๆ (ยังไม่ลง DB) — เซิร์ฟเวอร์รีสตาร์ท
  // ครั้งเดียวก็ลืมหมดทุกโต๊ะ ทั้งที่หน้านี้ยังเปิดอัดอยู่จริง heartbeat ครั้งต่อไปจะโดน
  // 409 (จับจองหมดอายุ) เงียบๆ ตลอดไป เพราะโค้ดเดิม .catch() ทิ้งแล้วไม่เคยเช็ค status —
  // ผลคือหน้าเลือกโต๊ะขึ้น "ไม่ได้เชื่อมต่อ" ค้างแม้กล้องกำลังอัดอยู่จริง ต้องมีคนไปเปิด
  // หน้าตั้งค่าใหม่เองถึงจะกลับมา ต้องจับจองซ้ำเองตรงนี้แทนไม่ให้ต้องพึ่งคน
  var reclaiming = false;

  function reclaim() {
    if (reclaiming) return;
    reclaiming = true;
    fetch('/api/stations/' + encodeURIComponent(station) + '/claim', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        client_id: localStorage.getItem(K.client),
        device_name: localStorage.getItem(K.device) || 'ไม่ทราบชื่อ',
      }),
    }).then(function (r) {
      reclaiming = false;
      // เครื่องอื่นแย่งโต๊ะนี้ไปแล้วจริงๆ (409) ระหว่างที่เราหลุด — ต้องบอกคนหน้างาน
      // ไม่ใช่แค่ลองใหม่เงียบๆ เพราะแปลว่าคลิปที่กำลังอัดอยู่นี้ไม่มีโต๊ะรองรับแล้ว
      if (!r.ok) warn('โต๊ะนี้ถูกเครื่องอื่นจับจองไปแล้ว — คลิปนี้จะไม่ถูกนับที่โต๊ะนี้อีก');
    }).catch(function () { reclaiming = false; });
  }

  function sendHeartbeat() {
    fetch('/api/stations/' + encodeURIComponent(station) + '/heartbeat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        client_id: localStorage.getItem(K.client),
        queue_depth: S.queueDepth,
        app_version: VERSION,
        // หน้านี้เป็นตัวเดียวที่รู้จริงว่ากำลังบันทึกอยู่ไหม — เซิร์ฟเวอร์เดาจาก
        // สัญญาณ start/commit ได้ไม่แม่น เพราะกล้องอาจเปิดไม่ได้ทั้งที่ออเดอร์เริ่มแล้ว
        recording: !!S.clipId,
        camera_ready: isCameraLive(),
      }),
    }).then(function (r) { if (r.status === 409) reclaim(); }).catch(function () {});
  }

  setInterval(sendHeartbeat, 30000);

  // ── กันหน้าปิดโดยไม่ตั้งใจ ──────────────────────────────────
  window.addEventListener('beforeunload', function (e) {
    if (S.clipId || S.queueDepth) { e.preventDefault(); e.returnValue = ''; }
    navigator.sendBeacon('/api/station/' + encodeURIComponent(station) + '/detach', new Blob([], {}));
  });

  // จอดับกลางกะแล้วกล้องอาจถูกปล่อย — ขอไม่ให้ดับ
  if (navigator.wakeLock) {
    navigator.wakeLock.request('screen').catch(function () {});
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function () {});
    });
  }

  // เน็ตกลับมาแล้วส่งต่อทันที ไม่ต้องรอจังหวะถอยของ backoff
  window.addEventListener('online', function () { queue.resume(); });

  // ── แผงตั้งค่า/คู่มือ (FR-10 · FR-11) ───────────────────────
  /**
   * หน้านี้เปลี่ยนหน้าไม่ได้ระหว่างกะ แผงจึงต้องแก้ค่าได้ในหน้าเดิมจริงๆ
   *
   * isRecording บอกแผงจากค่าที่หน้านี้รู้เอง ซึ่งรู้ก่อนเซิร์ฟเวอร์เสมอ — แผงล็อก
   * ถ้าฝั่งใดฝั่งหนึ่งบอกว่ากำลังอัด เอียงไปทางล็อกไว้ก่อนดีกว่าปล่อยให้คลิปขาด
   */
  if (window.PackvideoPanel) {
    PackvideoPanel.mount({
      role: 'packer',
      // เฉพาะหน้านี้ที่มีคลิปย้อนหลัง (FR-10.9) — monitor/clips เป็นของหัวหน้ากับทีมเคลม
      clips: true,
      hooks: {
        isRecording: function () { return !!S.clipId; },

        // เปลี่ยนกล้องแบบไม่รีโหลด — ปิด stream เดิมแล้วเปิดตัวใหม่ทับพรีวิว
        // แผงล็อกปุ่มนี้ระหว่างอัดอยู่แล้ว ตรงนี้จึงไม่มีคลิปให้ทำขาด
        onCameraChange: function () {
          try { if (S.stream) S.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
          S.stream = null;
          startCamera().catch(function (e) { warn('เปิดกล้องตัวใหม่ไม่ได้: ' + e.message); });
        },

        // ย้ายโต๊ะ/ล้างค่า = ต้องต่อ SSE ใหม่ทั้งหมด รีโหลดตรงไปตรงมากว่าและปลอดภัย
        // เพราะสองอย่างนี้ถูกล็อกไว้ระหว่างอัดอยู่แล้ว คิวอยู่บน IndexedDB ไม่หาย
        onStationChange: function () { location.reload(); },
        onRelease: function () { location.reload(); },
      },
    });
  }

  /**
   * เปิดกล้องพร้อมเพดานเวลา — getUserMedia อาจค้างไม่ตอบ (มีป๊อปอัปขออนุญาตรออยู่ หรือไดรเวอร์กล้องค้าง)
   * ตอนค้าง หน้านี้ต้องบอกให้รู้ (warn + heartbeat ว่ากล้องไม่พร้อม) ไม่ใช่เงียบ
   * สตรีมที่มาช้าทีหลังยังใช้ได้ (startCamera ตั้งค่าเองเมื่อสำเร็จ) และไม่เปิดซ้อนขณะยังค้างอยู่
   */
  var camPending = false;
  function withTimeout(promise, ms, message) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error(message)); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }
  function ensureCamera() {
    if (camPending) return Promise.resolve();
    camPending = true;
    var p = startCamera();
    p.then(function () { camPending = false; }, function () { camPending = false; });
    return withTimeout(p, 10000, 'กล้องไม่ตอบสนองภายใน 10 วินาที').catch(function (e) {
      warn('เปิดกล้องไม่ได้: ' + e.message);
      sendHeartbeat();
    });
  }

  // กล้องถูกถอด/เปิดไม่สำเร็จ → ลองใหม่เองทุก 20 วินาที (เสียบกล้องคืนแล้วไม่ต้องมีใครมารีเฟรช)
  // ไม่แตะระหว่างกำลังอัด
  setInterval(function () {
    if (!S.clipId && !S.stream) ensureCamera();
  }, 20000);

  setText('station', station);
  queue.init()
    .catch(function (e) { warn('เปิดคิวในเครื่องไม่ได้: ' + e.message); })
    .then(function () {
      // ต่อ SSE ก่อนกล้องเสมอ — กล้องค้างต้องไม่ทำให้หน้าต่างอัดหูหนวก (เดิมต้องรอกล้องก่อนถึงจะต่อ)
      connect();
      return ensureCamera();
    });
})();
</script>

</body>
</html>
