<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ค้นหาคลิป — packvideo</title>
<style>
  :root { color-scheme: light dark; --line: rgba(128,128,128,.28); --accent: #2563eb;
          --ok: #1a7f37; --warn: #9a6700; --bad: #b62324; --muted: rgba(128,128,128,.14); }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
         margin: 0; padding: 0; line-height: 1.5; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
           background: Canvas; z-index: 10; }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 17px; margin: 0; flex: 1; }
  .who { font-size: 13px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .search { display: flex; gap: 8px; }
  input[type=text], input[type=date], select {
    font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: inherit; min-width: 0; }
  #q { flex: 1; font-size: 15px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
           border: 1px solid var(--line); background: transparent; color: inherit; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; align-items: center; }
  .filters select, .filters input { padding: 6px 8px; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 16px; font-weight: 600; }
  #count { margin-left: auto; opacity: .65; font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(300px, 440px) 1fr; }
  .list { border-right: 1px solid var(--line); overflow-y: auto; height: calc(100vh - var(--head, 150px)); }
  .detail { padding: 18px; overflow-y: auto; height: calc(100vh - var(--head, 150px)); }
  .back { display: none; margin-bottom: 12px; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .list, .detail { height: auto; border-right: 0; }
    body.show-detail .list { display: none; }
    body:not(.show-detail) .detail { display: none; }
    .back { display: inline-block; }
    .who { max-width: 30vw; }
  }
  .row { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: rgba(128,128,128,.07); }
  .row[aria-selected="true"] { background: rgba(37,99,235,.12); box-shadow: inset 3px 0 0 var(--accent); }
  .row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row .ord { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 14px; word-break: break-all; }
  .row .meta { font-size: 12px; opacity: .7; margin-top: 3px; }
  .tags { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; font-weight: 700;
          background: var(--muted); white-space: nowrap; }
  .pill.good { background: rgba(26,127,55,.16); color: var(--ok); }
  .pill.warn { background: rgba(154,103,0,.18); color: var(--warn); }
  .pill.bad  { background: rgba(182,35,36,.16); color: var(--bad); }
  .more { display: block; width: calc(100% - 28px); margin: 12px 14px 24px; }
  video { width: 100%; max-width: 720px; border-radius: 10px; background: #000; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-size: 13px; margin: 16px 0 0; max-width: 720px; }
  dt { opacity: .55; } dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  h2 { font-size: 12px; letter-spacing: .04em; opacity: .6; margin: 22px 0 8px; font-weight: 700; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .form { display: none; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; max-width: 720px; font-size: 13px; }
  .form.show { display: flex; }
  .form input { flex: 1; min-width: 160px; }
  .timeline { font-size: 12px; font-family: ui-monospace, Menlo, monospace; max-width: 720px; }
  .timeline div { padding: 3px 0; border-bottom: 1px solid rgba(128,128,128,.12); }
  .empty { padding: 40px 20px; text-align: center; opacity: .6; font-size: 14px; }
  .msg { padding: 11px 14px; border-radius: 8px; margin-top: 12px; font-size: 13px; display: none; max-width: 720px; }
  .msg.ok  { background: rgba(26,127,55,.12); border: 1px solid rgba(26,127,55,.4); display: block; }
  .msg.bad { background: rgba(182,35,36,.12); border: 1px solid rgba(182,35,36,.4); display: block; }
  .notice { padding: 14px; border-radius: 8px; max-width: 720px; font-size: 14px; }
  .notice.bad  { background: rgba(182,35,36,.1); border: 1px solid rgba(182,35,36,.4); }
  .notice.warn { background: rgba(154,103,0,.1); border: 1px solid rgba(154,103,0,.4); }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>

<header id="head">
  <div class="bar">
    <h1>ค้นหาคลิปการแพ็ค</h1>
    <span class="who" data-packvideo-user></span>
    <span data-packvideo-panel></span>
  </div>
  <div class="search">
    <input type="text" id="q" placeholder="เลขออเดอร์ เลขพัสดุ หรือ IMEI — วางอันไหนก็ได้" autofocus enterkeyhint="search">
    <button class="primary" id="go">ค้นหา</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-chip="today">วันนี้</button>
    <button class="chip" data-chip="week">7 วัน</button>
    <button class="chip" data-chip="novideo">ไม่มีวิดีโอ วันนี้</button>
    <button class="chip" data-chip="clear">ล้างตัวกรอง</button>
  </div>
  <div class="filters">
    <input type="date" id="from" aria-label="ตั้งแต่วันที่"> –
    <input type="date" id="to" aria-label="ถึงวันที่">
    <select id="station" aria-label="โต๊ะ"><option value="">ทุกโต๊ะ</option></select>
    <select id="packer" aria-label="พนักงาน"><option value="">ทุกคน</option></select>
    <select id="status" aria-label="สถานะ"><option value="">ทุกสถานะ</option></select>
    <select id="problem" aria-label="วิดีโอ">
      <option value="">วิดีโอ: ทั้งหมด</option>
      <option value="any">มีปัญหา (ไม่มี/เปิดไม่ได้)</option>
      <option value="no_video">ไม่ได้บันทึก</option>
      <option value="corrupt">ไฟล์เปิดไม่ได้</option>
      <option value="deleted">ลบแล้วตามกำหนด</option>
    </select>
    <label><input type="checkbox" id="pinned"> ตรึงไว้</label>
    <button id="csv" title="ส่งออกผลค้นหาทั้งหมด (สูงสุด 5,000 แถว)">ส่งออก Excel</button>
    <span id="count"></span>
  </div>
</header>

<main>
  <div class="list" id="list"><div class="empty">พิมพ์เลขแล้วกดค้นหา หรือเลือกช่วงวัน</div></div>
  <div class="detail" id="detail"><div class="empty">เลือกคลิปจากรายการ</div></div>
</main>

<script src="/session.js"></script>
<script>
(function () {
  'use strict';
  var lastParams = null;
  var nextBefore = null;
  var FIELDS = ['q', 'from', 'to', 'station', 'packer', 'status', 'problem'];
  // รหัสในระบบ → ภาษาคนหน้างาน (R4.2) · ไม่รู้จักก็แสดงรหัสเดิม ดีกว่าซ่อน
  var WORD_TH = {
    empty: 'ไม่มีวิดีโอ', anomaly: 'สัญญาณผิดปกติ', case_opened: 'เปิดเคสแล้ว', manual: 'ตรึงเอง',
    mismatch: 'ยิงใบปะหน้าไม่ตรง', no_tracking: 'ไม่มีเลขพัสดุ', cancelled: 'ออเดอร์ถูกยกเลิก',
    low_price: 'ราคาต่ำกว่าทุน', head_trimmed: 'ตัดข้อมูลคลิปอื่นหน้าไฟล์', no_header: 'ไฟล์ไม่มีส่วนหัว',
    head_offset: 'กู้ไฟล์แล้ว', finalise_failed: 'รวมไฟล์ไม่สำเร็จ', imei_incomplete: 'IMEI ไม่ครบ',
    server_restart: 'เซิร์ฟเวอร์รีสตาร์ทระหว่างอัด (ท้ายคลิปขาด)', recovered: 'ต่อไฟล์จากชิ้นที่ค้าง',
    incomplete: 'วิดีโอขาดช่วง (ชิ้นมาไม่ครบ)',
  };
  function th(list) { return (list || []).map(function (k) { return WORD_TH[k] || k; }).join(', '); }

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s)
    .replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function dt(s) { return s ? new Date(s).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '—'; }
  function secs(ms) { return ms == null ? '—' : Math.round(ms / 1000) + ' วิ'; }
  function mb(b) { return b ? (b / 1048576).toFixed(2) + ' MB' : '—'; }
  function ymd(d) { return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' }); }
  function json(r) { return r.json(); }

  // ความสูงหัวหน้าเปลี่ยนตามจอ — ให้รายการเลื่อนในพื้นที่ที่เหลือพอดี
  function fitHead() { document.documentElement.style.setProperty('--head', $('head').offsetHeight + 'px'); }
  window.addEventListener('resize', fitHead);

  // ── ตัวเลือกกรอง ────────────────────────────────────────────
  function loadOptions() {
    return fetch('/api/search/options').then(json).then(function (d) {
      if (!d.ok) return;
      (d.stations || []).forEach(function (s) { $('station').add(new Option(s, s)); });
      (d.packers || []).forEach(function (p) { $('packer').add(new Option(p, p)); });
      Object.keys(d.status || {}).forEach(function (k) {
        if (k !== 'pending' && k !== 'recording' && k !== 'closing') $('status').add(new Option(d.status[k], k));
      });
    }).catch(function () {});
  }

  function params() {
    var p = new URLSearchParams();
    FIELDS.forEach(function (id) { var v = $(id).value.trim(); if (v) p.set(id, v); });
    if ($('pinned').checked) p.set('pinned', 'true');
    return p;
  }

  // ── ค้นหา ───────────────────────────────────────────────────
  function search(append) {
    var p = append ? new URLSearchParams(lastParams) : params();
    if (!append) {
      lastParams = p.toString();
      // เก็บตัวกรองไว้ใน URL — แชร์ลิงก์ผลค้นหาได้ และรีเฟรชแล้วไม่หาย
      history.replaceState(null, '', lastParams ? '?' + lastParams : location.pathname);
      if (!lastParams) {
        $('list').innerHTML = '<div class="empty">พิมพ์เลขแล้วกดค้นหา หรือเลือกช่วงวัน</div>';
        $('count').textContent = '';
        return;
      }
      $('list').innerHTML = '<div class="empty">กำลังค้นหา…</div>';
    } else {
      p.set('before', nextBefore);
    }
    p.set('limit', '100');

    var more = $('more');
    if (more) { more.disabled = true; more.textContent = 'กำลังโหลด…'; }

    fetch('/api/search?' + p.toString()).then(json).then(function (d) {
      if (more) more.remove();
      if (!d.ok) { $('list').innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }
      nextBefore = d.next_before;
      if (!append) $('list').innerHTML = '';
      if (!append && !d.clips.length) {
        $('list').innerHTML = '<div class="empty">ไม่พบคลิปที่ตรงกับที่ค้น</div>';
        $('count').textContent = '0 คลิป';
        return;
      }
      $('list').insertAdjacentHTML('beforeend', d.clips.map(rowHtml).join(''));
      var shown = $('list').querySelectorAll('.row').length;
      $('count').textContent = shown + ' คลิป' + (d.truncated ? '+' : '');
      if (d.truncated) {
        $('list').insertAdjacentHTML('beforeend', '<button class="more" id="more">โหลดเพิ่ม</button>');
        $('more').onclick = function () { search(true); };
      }
      // ค้นเลขเดียวแล้วเจอคลิปเดียว — เปิดให้เลย ไม่ต้องกดอีกที
      if (!append && d.clips.length === 1 && $('q').value.trim()) select(d.clips[0].clip_id);
    }).catch(function (e) {
      $('list').innerHTML = '<div class="empty">ค้นหาไม่สำเร็จ: ' + esc(e.message) + '</div>';
    });
  }

  function tone(status) {
    return status === 'verified' || status === 'registered' ? 'good'
      : status === 'unverified' || status === 'timeout' ? 'warn' : '';
  }

  function tags(c) {
    var out = '<span class="pill ' + tone(c.status) + '">' + esc(c.status_th || c.status) + '</span>';
    if (c.problem === 'no_video' || c.problem === 'corrupt') out += '<span class="pill bad">' + esc(c.problem_th) + '</span>';
    else if (c.problem === 'deleted') out += '<span class="pill">' + esc(c.problem_th) + '</span>';
    if (c.repaired) out += '<span class="pill warn">กู้ไฟล์แล้ว</span>';
    if (c.pinned) out += '<span class="pill">📌 ตรึงไว้</span>';
    return out;
  }

  function rowHtml(c) {
    return '<div class="row" data-id="' + esc(c.clip_id) + '" role="option" aria-selected="false" tabindex="0">' +
      '<div class="top"><span class="ord">' + esc(c.ordersn || c.project_id || '(ไม่มีเลขออเดอร์)') + '</span>' +
      '<span class="meta">' + esc(dt(c.started_at)) + '</span></div>' +
      '<div class="meta">' + esc([c.tracking_no, c.station_id, c.packer, secs(c.duration_ms)].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="tags">' + tags(c) + '</div></div>';
  }

  $('list').addEventListener('click', function (e) {
    var r = e.target.closest('.row');
    if (r) select(r.dataset.id);
  });
  $('list').addEventListener('keydown', function (e) {
    var r = e.target.closest('.row');
    if (r && e.key === 'Enter') select(r.dataset.id);
  });

  // ── รายละเอียด ──────────────────────────────────────────────
  function select(id) {
    [].forEach.call(document.querySelectorAll('.row'), function (el) {
      el.setAttribute('aria-selected', String(el.dataset.id === id));
    });
    document.body.classList.add('show-detail');
    $('detail').innerHTML = '<div class="empty">กำลังโหลด…</div>';
    fetch('/api/search/' + encodeURIComponent(id)).then(json).then(function (d) {
      if (!d.ok) { $('detail').innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }
      render(d.clip, d.events || []);
    });
  }

  // สามกรณีที่เคยปนกันเป็น "ไม่มีวิดีโอแล้ว" คำเดียว จนทีมเคลมเข้าใจผิดว่าลบตามกำหนด (R4.1)
  function notice(c) {
    if (c.problem === 'no_video') {
      return '<div class="notice bad"><b>ไม่มีวิดีโอของออเดอร์นี้</b><br>' +
        'ระบบได้สัญญาณแพ็คครบ แต่ไม่มีภาพจากกล้องเข้ามาเลย — กล้องหรือหน้าต่างอัดของโต๊ะ ' + esc(c.station_id) +
        ' ไม่ทำงานตอนนั้น · ใช้เป็นหลักฐานไม่ได้</div>';
    }
    if (c.problem === 'deleted') {
      return '<div class="notice warn"><b>ไฟล์ถูกลบตามกำหนดเก็บ 30 วัน</b><br>คลิปนี้เคยมีวิดีโอจริง ลบเมื่อ ' + esc(dt(c.media_deleted_at)) + '</div>';
    }
    if (c.problem === 'corrupt') {
      return '<div class="notice bad"><b>ไฟล์วิดีโอเปิดไม่ได้</b><br>ส่วนหัวไฟล์เสีย — แจ้งผู้ดูแลให้รันเครื่องมือกู้ไฟล์ (npm run repair:head)</div>';
    }
    return '';
  }

  function playable(c) { return c.media_available && c.problem !== 'corrupt'; }

  function render(c, events) {
    $('detail').innerHTML =
      '<button class="back" id="back">← กลับไปรายการ</button>' +
      (playable(c) ? '<video controls preload="metadata" playsinline src="' + esc(c.media_url) + '"></video>' : notice(c)) +
      '<div class="tags">' + tags(c) + '</div>' +
      '<dl>' +
      row('เลขออเดอร์', c.ordersn || c.project_id) + row('เลขพัสดุ', c.tracking_no) +
      row('IMEI', (c.imeis || []).join(', ')) +
      row('โต๊ะ', c.station_id) + row('พนักงาน', c.packer) +
      row('เริ่มอัด', dt(c.started_at)) + row('ความยาว', secs(c.duration_ms)) +
      row('ขนาด', mb(c.bytes)) +
      (c.pinned ? row('ตรึงไว้เพราะ', th(c.pin_reasons)) : '') +
      (c.flags && c.flags.length ? row('สัญญาณผิดปกติ', th(c.flags)) : '') +
      row('ค่าตรวจไฟล์', c.checksum) +
      '</dl>' +
      (playable(c) ? actionsHtml(c) : '') +
      '<div class="msg" id="msg"></div>' +
      '<h2>เกิดอะไรขึ้นกับคลิปนี้</h2>' +
      '<div class="timeline">' + events.map(function (e) {
        return '<div>' + esc(new Date(e.at).toLocaleTimeString('th-TH')) + '  ' +
          esc(e.event) + (e.actor ? ' · ' + esc(e.actor) : '') +
          (e.detail && Object.keys(e.detail).length ? '  ' + esc(JSON.stringify(e.detail)) : '') + '</div>';
      }).join('') + '</div>';

    $('back').onclick = function () { document.body.classList.remove('show-detail'); };
    if (playable(c)) bindActions(c);
    $('detail').scrollTop = 0;
  }

  function row(k, v) { return '<dt>' + esc(k) + '</dt><dd>' + esc(v || '—') + '</dd>'; }

  function actionsHtml(c) {
    return '<h2>ทำอะไรกับคลิปนี้</h2><div class="actions">' +
      '<button class="primary" id="btn-export">ดาวน์โหลดไฟล์ส่งแพลตฟอร์ม</button>' +
      '<button id="btn-frame">ดึงรูปนิ่ง ณ วินาทีที่ดูอยู่</button>' +
      '<button id="btn-share">สร้างลิงก์ส่งขนส่ง/ลูกค้า</button>' +
      '<button id="btn-pin">' + (c.pinned ? 'ถอนการตรึง' : 'ตรึงไว้ไม่ให้ถูกลบ') + '</button>' +
      '</div>' +
      '<div class="form" id="form-share">' +
      '<label>ใช้ได้ <select id="share-days"><option>3</option><option selected>7</option><option>14</option><option>30</option></select> วัน</label>' +
      '<input type="text" id="share-note" placeholder="ส่งให้ใคร เพราะอะไร (เช่น Flash เคลมของหาย)">' +
      '<button class="primary" id="share-go">สร้างลิงก์</button></div>' +
      '<div class="form" id="form-pin">' +
      '<input type="text" id="pin-note" placeholder="ตรึงไว้เพราะอะไร (เช่น เคส #12345)">' +
      '<button class="primary" id="pin-go">ตรึงไว้</button></div>';
  }

  function msg(kind, html) { var el = $('msg'); el.className = 'msg ' + kind; el.innerHTML = html; }

  function bindActions(c) {
    /**
     * เตรียมไฟล์แล้วบันทึกลงเครื่องในคลิกเดียว
     *
     * ไม่ใช้ <a download> ชี้ตรงไปที่ endpoint เพราะถ้าเซิร์ฟเวอร์ตอบ error กลับมา
     * เบราว์เซอร์จะบันทึกข้อความ error นั้นเป็นไฟล์ .json แทน แล้วผู้ใช้เห็นแค่
     * "ดาวน์โหลดไม่สำเร็จ" โดยไม่รู้สาเหตุ (เจอจริงตอนคลิปถูกลบไปแล้ว)
     *
     * ชื่อผู้ทำรายการเซิร์ฟเวอร์เอาจากบัญชีที่ล็อกอินเอง ไม่ส่งจากหน้าเว็บ (R3.3)
     */
    $('btn-export').onclick = function () {
      var b = this;
      var reset = function () { b.disabled = false; b.textContent = 'ดาวน์โหลดไฟล์ส่งแพลตฟอร์ม'; };
      b.disabled = true; b.textContent = 'กำลังเตรียมไฟล์…';
      fetch('/api/clips/' + c.clip_id + '/export', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
      }).then(json).then(function (d) {
        if (!d.ok) { reset(); msg('bad', esc(d.error)); return; }
        b.textContent = 'กำลังดาวน์โหลด…';
        return fetch(d.download_url).then(function (r) {
          if (!r.ok) {
            return r.json().catch(function () { return { error: 'ดาวน์โหลดไม่สำเร็จ (HTTP ' + r.status + ')' }; })
              .then(function (e) { throw new Error(e.error || 'ดาวน์โหลดไม่สำเร็จ'); });
          }
          return r.blob();
        }).then(function (blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = (c.ordersn || c.clip_id) + '.mp4';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
          reset();
          msg('ok', '<b>บันทึกไฟล์แล้ว</b> — ' + d.duration_sec + ' วินาที · ' + d.mb + ' MB' +
            ' (เพดานแพลตฟอร์ม 60 วินาที / 30 MB)<br>เอาไฟล์นี้อัปเข้า Seller Center เอง — ส่งผ่าน API ไม่ได้');
        });
      }).catch(function (e) { reset(); msg('bad', esc(e.message)); });
    };

    $('btn-frame').onclick = function () {
      var v = document.querySelector('#detail video');
      var at = Math.round((v && v.currentTime ? v.currentTime : 0) * 1000);
      window.open('/api/clips/' + c.clip_id + '/frame?at_ms=' + at, '_blank');
    };

    $('btn-share').onclick = function () { $('form-share').classList.toggle('show'); $('share-note').focus(); };
    $('share-go').onclick = function () {
      fetch('/api/clips/' + c.clip_id + '/share', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: $('share-note').value.trim(), days: Number($('share-days').value) || 7 }),
      }).then(json).then(function (d) {
        if (!d.ok) { msg('bad', esc(d.error)); return; }
        $('form-share').classList.remove('show');
        msg('ok', '<b>ลิงก์พร้อมส่ง</b> (หมดอายุ ' + esc(dt(d.expires_at)) + ')<br><code>' + esc(d.url) + '</code><br>' +
          '<button id="copy" style="margin-top:8px">คัดลอกลิงก์</button>');
        $('copy').onclick = function () {
          var btn = this;
          navigator.clipboard.writeText(d.url).then(function () { btn.textContent = 'คัดลอกแล้ว'; });
        };
      });
    };

    function pin(pinning, note) {
      fetch('/api/clips/' + c.clip_id + '/pin', {
        method: pinning ? 'POST' : 'DELETE', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pinning ? { note: note } : {}),
      }).then(json).then(function (d) {
        if (!d.ok) { msg('bad', esc(d.error)); return; }
        select(c.clip_id);
      });
    }
    $('btn-pin').onclick = function () {
      if (c.pinned) {
        if (confirm('ถอนการตรึงแล้วคลิปนี้จะถูกลบเมื่อครบกำหนด ยืนยันไหม')) pin(false);
      } else {
        $('form-pin').classList.toggle('show'); $('pin-note').focus();
      }
    };
    $('pin-go').onclick = function () { pin(true, $('pin-note').value.trim()); };
  }

  // ── ตัวกรองด่วน ─────────────────────────────────────────────
  $('chips').addEventListener('click', function (e) {
    var chip = e.target.closest('[data-chip]');
    if (!chip) return;
    var today = ymd(new Date());
    var kind = chip.dataset.chip;
    if (kind === 'clear') {
      FIELDS.forEach(function (id) { $(id).value = ''; });
      $('pinned').checked = false;
    } else {
      $('q').value = '';
      $('to').value = today;
      $('from').value = kind === 'week' ? ymd(new Date(Date.now() - 6 * 86400000)) : today;
      $('problem').value = kind === 'novideo' ? 'any' : '';
    }
    search(false);
  });

  $('go').onclick = function () { search(false); };
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(false); });
  ['from', 'to', 'station', 'packer', 'status', 'problem', 'pinned'].forEach(function (id) {
    $(id).onchange = function () { search(false); };
  });
  $('csv').onclick = function () {
    var p = params();
    if (!p.toString()) { alert('เลือกช่วงวันหรือตัวกรองก่อนส่งออก'); return; }
    location.href = '/api/search/export.csv?' + p.toString();
  };

  PackvideoSession.render();
  fitHead();

  // เปิดจากหน้าเคส หรือจากลิงก์ที่แชร์มา: /clips.html?q=<ordersn>&from=...
  loadOptions().then(function () {
    var url = new URLSearchParams(location.search);
    var any = false;
    FIELDS.forEach(function (id) { if (url.get(id)) { $(id).value = url.get(id); any = true; } });
    if (url.get('pinned') === 'true') { $('pinned').checked = true; any = true; }
    if (any) search(false);
    fitHead();
  });
})();
</script>

<script src="/panel.js"></script>
<script>PackvideoPanel.mount({ role: 'cs' });</script>
</body>
</html>
